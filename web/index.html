<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="description" content="Lightweight SSH client & terminal emulator.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ShellLite">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShellLite</title>
  <link rel="manifest" href="manifest.json">

  <!-- Crisp Monospace Fonts for Terminal Rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0B0F14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #F0F6FC;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0B0F14;
      z-index: 999999;
      transition: opacity 0.3s ease-out;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(63, 185, 80, 0.2);
      border-top-color: #3FB950;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 18px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #F0F6FC;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 13px;
      color: #8B949E;
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="spinner"></div>
    <div class="loading-title">⚡ ShellLite</div>
    <div class="loading-sub" id="loading-status">Loading terminal...</div>
  </div>

  <script>
    // Clean up any stale or looping service workers and caches from previous versions
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function (names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }

    function hideLoader() {
      var loader = document.getElementById('app-loading');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function () {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 300);
      }
    }

    window.addEventListener('flutter-first-frame', hideLoader);

    // Check periodically for Flutter rendering elements
    var checkInterval = setInterval(function () {
      if (document.querySelector('flutter-view, flt-glass-pane, canvas, flt-scene-host')) {
        hideLoader();
        clearInterval(checkInterval);
      }
    }, 100);

    // Fail-safe fallback so loading screen never hangs permanently
    setTimeout(function () {
      clearInterval(checkInterval);
      hideLoader();
    }, 3500);
  </script>

  <script>
    // Keep virtual keyboard active on mobile web browsers (Safari / Chrome)
    // when tapping on-screen shortcut keys, accessory buttons, or UI controls.
    (function() {
      var lastActiveInput = null;
      var isTouching = false;

      document.addEventListener('focusin', function(e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) {
          lastActiveInput = e.target;
        }
      }, true);

      // Prevent browser default focus change / blur when tapping toolbar shortcuts
      document.addEventListener('pointerdown', function(e) {
        isTouching = true;
        if (lastActiveInput && lastActiveInput.isConnected) {
          if (e.target !== lastActiveInput && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            try {
              lastActiveInput.focus({ preventScroll: true });
            } catch (_) {}
          }
        }
      }, { capture: true, passive: false });

      document.addEventListener('mousedown', function(e) {
        if (lastActiveInput && lastActiveInput.isConnected) {
          if (e.target !== lastActiveInput && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            try {
              lastActiveInput.focus({ preventScroll: true });
            } catch (_) {}
          }
        }
      }, { capture: true, passive: false });

      document.addEventListener('pointerup', function(e) {
        isTouching = false;
        if (lastActiveInput && lastActiveInput.isConnected && document.activeElement !== lastActiveInput) {
          try {
            lastActiveInput.focus({ preventScroll: true });
          } catch (_) {}
        }
      }, { capture: true, passive: true });

      document.addEventListener('touchend', function(e) {
        isTouching = false;
        if (lastActiveInput && lastActiveInput.isConnected && document.activeElement !== lastActiveInput) {
          try {
            lastActiveInput.focus({ preventScroll: true });
          } catch (_) {}
        }
      }, { capture: true, passive: true });

      document.addEventListener('focusout', function(e) {
        if (isTouching && lastActiveInput && lastActiveInput.isConnected && e.target === lastActiveInput) {
          try {
            lastActiveInput.focus({ preventScroll: true });
          } catch (_) {}
        }
      }, true);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
