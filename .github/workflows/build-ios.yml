name: Build Flutter iOS

on:
  workflow_call:
    inputs:
      upload_artifact:
        description: 'Whether to package and upload the .ipa artifact'
        required: false
        default: false
        type: boolean
      version:
        description: 'Version string for the IPA build'
        required: false
        default: '1.0.1'
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    name: Flutter iOS Build
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          channel: ${{ vars.FLUTTER_CHANNEL || 'stable' }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App
        run: |
          set -e
          echo "==> Building Flutter iOS App..."
          flutter build ios --no-codesign --release --build-name="${{ inputs.version }}" --build-number="${{ github.run_number }}"

      - name: Package .ipa
        if: inputs.upload_artifact
        run: |
          set -e
          APP="${{ vars.APP_NAME || 'ShellLite' }}"
          mkdir -p build_output/Payload
          cp -R build/ios/iphoneos/Runner.app "build_output/Payload/${APP}.app"

          echo "Applying ad-hoc code signature for sideloading..."
          codesign --force --deep --sign - "build_output/Payload/${APP}.app"

          cd build_output
          zip -r "../${APP}.ipa" Payload
          cd ..

          echo "${APP}.ipa created successfully:"
          ls -lh "${APP}.ipa"

      - name: Upload IPA Artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: ${{ vars.APP_NAME || 'ShellLite' }}-iOS-IPA
          path: ${{ vars.APP_NAME || 'ShellLite' }}.ipa
          retention-days: ${{ fromJson(vars.ARTIFACT_RETENTION_DAYS || '30') }}
