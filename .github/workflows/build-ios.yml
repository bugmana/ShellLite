name: Build Flutter iOS

on:
  workflow_call:
    inputs:
      upload_artifact:
        description: 'Whether to package and upload the .ipa artifact'
        required: false
        default: false
        type: boolean
      version:
        description: 'Version string for the IPA build'
        required: false
        default: '1.0.1'
        type: string

jobs:
  build-ios:
    name: Flutter iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App
        run: |
          set -e
          echo "==> Building Flutter iOS App..."
          flutter build ios --no-codesign --release --build-name="${{ inputs.version }}" --build-number="${{ github.run_number }}"

      - name: Package .ipa
        if: inputs.upload_artifact
        run: |
          set -e
          mkdir -p build_output/Payload
          cp -R build/ios/iphoneos/Runner.app build_output/Payload/ShellLite.app

          echo "Applying ad-hoc code signature for sideloading..."
          codesign --force --deep --sign - build_output/Payload/ShellLite.app

          cd build_output
          zip -r ../ShellLite.ipa Payload
          cd ..

          echo "ShellLite.ipa created successfully:"
          ls -lh ShellLite.ipa

      - name: Upload IPA Artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShellLite-iOS-IPA
          path: ShellLite.ipa
          retention-days: 30
