name: Build & Release iOS IPA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Environment
        run: |
          xcodebuild -version
          swift --version

      - name: Run Tests
        run: swift test

      - name: Build iOS Target via Xcodebuild
        run: |
          xcodebuild build \
            -scheme ShellLite \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          # Extract version from tag or default
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0-dev"
          fi
          BUILD="${{ github.run_number }}"

          mkdir -p build_output/Payload/ShellLite.app

          # Locate compiled executable from DerivedData
          BINARY=$(find "$RUNNER_TEMP/DerivedData" -type f -name "ShellLite" ! -path "*.dSYM*" ! -path "*.build*" | head -n 1)
          if [ -z "$BINARY" ]; then
            echo "Error: ShellLite executable not found in DerivedData"
            exit 1
          fi
          echo "Found binary at: $BINARY"

          cp "$BINARY" build_output/Payload/ShellLite.app/ShellLite
          chmod +x build_output/Payload/ShellLite.app/ShellLite
          cp Sources/ShellLite/Info.plist build_output/Payload/ShellLite.app/Info.plist

          # Stamp version metadata in Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" build_output/Payload/ShellLite.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" build_output/Payload/ShellLite.app/Info.plist || true

          # Ad-hoc sign for local sideloading / SideStore / Sideloadly
          codesign --force --deep --sign - build_output/Payload/ShellLite.app

          # Package into IPA
          cd build_output
          zip -r ../ShellLite.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShellLite-iOS-IPA
          path: ShellLite.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "ShellLite ${{ github.ref_name }}"
          files: ShellLite.ipa
          body: |
            ## ShellLite ${{ github.ref_name }}

            ### 📦 Download & Install on iPhone
            Download `ShellLite.ipa` directly to your iPhone or PC:
            - **SideStore**: Open `ShellLite.ipa` in the SideStore app on your iPhone.
            - **Sideloadly / AltStore**: Select `ShellLite.ipa` and install to your connected device.
          draft: false
          prerelease: false
