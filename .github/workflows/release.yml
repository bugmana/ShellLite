name: Release iOS IPA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Swift Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          xcodebuild -version
          swift --version

      - name: Run Tests
        run: swift test

  build-ipa:
    name: Build & Package iOS IPA
    needs: test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tools & Environment
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build for iOS
        run: |
          set -e
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK_PATH"
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          mkdir -p build_output/Payload/ShellLite.app

          echo "==> 1. Attempting build with swift build for iOS SDK..."
          swift build -c release \
            --sdk "$SDK_PATH" \
            --triple arm64-apple-ios18.0 \
            -Xlinker -syslibroot -Xlinker "$SDK_PATH" || true

          echo "==> 2. Attempting build with xcodebuild for iOS..."
          xcodebuild build \
            -scheme "ShellLite" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true

          # If standalone executable has not been generated, compile iOS UI executable with swiftc
          if [ ! -f "$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite" ] && \
             [ ! -f "$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite.app/ShellLite" ] && \
             [ ! -f ".build/arm64-apple-ios18.0/release/ShellLite" ]; then
            echo "==> 3. Compiling iOS UI executable using swiftc directly..."
            swift build -c release --sdk "$SDK_PATH" --triple arm64-apple-ios18.0 --target ShellLiteCore

            MODULE_PATHS=$(find .build/arm64-apple-ios18.0/release -name "*.swiftmodule" -exec dirname {} \; | sort -u)
            MODULE_ARGS=""
            for mp in $MODULE_PATHS; do
              MODULE_ARGS="$MODULE_ARGS -I $mp"
            done

            STATIC_LIBS=$(find .build/arm64-apple-ios18.0/release -maxdepth 1 -name "*.a" 2>/dev/null || true)

            swiftc -target arm64-apple-ios18.0 \
              -sdk "$SDK_PATH" \
              -O \
              -I .build/arm64-apple-ios18.0/release \
              $MODULE_ARGS \
              -L .build/arm64-apple-ios18.0/release \
              $STATIC_LIBS \
              -framework SwiftUI \
              -framework UIKit \
              -framework Foundation \
              -framework Security \
              Sources/ShellLite/ShellLite.swift \
              Sources/ShellLite/Views/*.swift \
              -o build_output/Payload/ShellLite.app/ShellLite
          fi

      - name: Package .ipa
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0-dev"
          fi
          BUILD="${{ github.run_number }}"

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          BINARY=""

          # Priority-based binary discovery
          if [ -f "build_output/Payload/ShellLite.app/ShellLite" ]; then
            BINARY="build_output/Payload/ShellLite.app/ShellLite"
          elif [ -f "$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite" ]; then
            BINARY="$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite"
            mkdir -p build_output/Payload/ShellLite.app
            cp "$BINARY" build_output/Payload/ShellLite.app/ShellLite
          elif [ -f "$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite.app/ShellLite" ]; then
            BINARY="$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite.app/ShellLite"
            mkdir -p build_output/Payload/ShellLite.app
            cp "$BINARY" build_output/Payload/ShellLite.app/ShellLite
          elif [ -f ".build/arm64-apple-ios18.0/release/ShellLite" ]; then
            BINARY=".build/arm64-apple-ios18.0/release/ShellLite"
            mkdir -p build_output/Payload/ShellLite.app
            cp "$BINARY" build_output/Payload/ShellLite.app/ShellLite
          else
            # Search for built Mach-O binary excluding dSYM and macosx debug artifacts
            BINARY=$(find "$DERIVED_DATA" .build -type f -name "ShellLite" ! -path "*.dSYM*" ! -path "*/checkouts/*" ! -path "*/arm64-apple-macosx/*" ! -path "*/debug/*" 2>/dev/null | head -n 1)
            if [ -n "$BINARY" ] && [ -f "$BINARY" ]; then
              mkdir -p build_output/Payload/ShellLite.app
              cp "$BINARY" build_output/Payload/ShellLite.app/ShellLite
            fi
          fi

          if [ ! -f "build_output/Payload/ShellLite.app/ShellLite" ]; then
            echo "Error: ShellLite executable binary was not found."
            echo "Listing potential build output locations:"
            find "$DERIVED_DATA" .build build_output -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          echo "Found binary at: build_output/Payload/ShellLite.app/ShellLite"
          file build_output/Payload/ShellLite.app/ShellLite
          chmod +x build_output/Payload/ShellLite.app/ShellLite

          if [ -f Sources/ShellLite/Info.plist ]; then
            cp Sources/ShellLite/Info.plist build_output/Payload/ShellLite.app/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" build_output/Payload/ShellLite.app/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" build_output/Payload/ShellLite.app/Info.plist || true
          fi

          echo "Applying ad-hoc code signature..."
          codesign --force --deep --sign - build_output/Payload/ShellLite.app

          cd build_output
          zip -r ../ShellLite.ipa Payload
          cd ..

          echo "ShellLite.ipa created successfully:"
          ls -lh ShellLite.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShellLite-iOS-IPA
          path: ShellLite.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "ShellLite ${{ github.ref_name }}"
          files: ShellLite.ipa
          body: |
            ## ShellLite ${{ github.ref_name }}

            ### 📦 Download & Install on iPhone
            Download `ShellLite.ipa` directly to your iPhone or PC:
            - **SideStore**: Open `ShellLite.ipa` in the SideStore app on your iPhone.
            - **Sideloadly / AltStore**: Select `ShellLite.ipa` and install to your connected device.
          draft: false
          prerelease: false
