name: Release Multi-Platform

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump level (auto computes semver from conventional commits)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (e.g. 1.2.0, only used if bump_type is custom)'
        required: false
        default: ''
        type: string
      deploy_to_play_store:
        description: 'Deploy Android App Bundle to Google Play Store'
        required: false
        default: true
        type: boolean
      play_store_track:
        description: 'Google Play release track'
        required: false
        default: 'alpha'
        type: choice
        options:
          - alpha
          - internal
          - beta
          - production
      play_store_status:
        description: 'Google Play release status'
        required: false
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ${{ vars.UBUNTU_SLIM_RUNNER || 'ubuntu-slim' }}
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      tag: ${{ steps.versioning.outputs.tag }}
      should_release: ${{ steps.versioning.outputs.should_release }}
      changelog: ${{ steps.versioning.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve Version & Tag
        id: versioning
        env:
          BUMP_TYPE: ${{ inputs.bump_type || 'auto' }}
          CUSTOM_VERSION: ${{ inputs.custom_version || '' }}
        run: |
          chmod +x scripts/resolve_version.sh
          ./scripts/resolve_version.sh "$BUMP_TYPE" "$CUSTOM_VERSION"

      - name: Tag and Push Release
        if: steps.versioning.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.versioning.outputs.tag }}
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Creating annotated tag $TAG..."
          git tag -a "$TAG" -m "Release $VERSION via GitHub Actions"
          git push origin "$TAG"

  build-ios:
    name: Build iOS
    needs: resolve-version
    if: needs.resolve-version.outputs.should_release == 'true'
    uses: ./.github/workflows/build-ios.yml
    with:
      upload_artifact: true
      version: ${{ needs.resolve-version.outputs.version }}

  build-android:
    name: Build Android
    needs: resolve-version
    if: needs.resolve-version.outputs.should_release == 'true'
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
    with:
      upload_artifact: true
      version: ${{ needs.resolve-version.outputs.version }}

  publish-release:
    name: Publish GitHub Release
    needs: [resolve-version, build-ios, build-android]
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ${{ vars.UBUNTU_SLIM_RUNNER || 'ubuntu-slim' }}
    steps:
      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: ${{ vars.APP_NAME || 'ShellLite' }}-iOS-IPA

      - name: Download Android APK Artifact
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: ${{ vars.APP_NAME || 'ShellLite' }}-Android-APK

      - name: Download Android AAB Artifact
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: ${{ vars.APP_NAME || 'ShellLite' }}-Android-AAB

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: "${{ needs.resolve-version.outputs.tag }}"
          name: "${{ vars.APP_NAME || 'ShellLite' }} ${{ needs.resolve-version.outputs.tag }}"
          files: |
            ${{ vars.APP_NAME || 'ShellLite' }}.ipa
            ${{ vars.APP_NAME || 'ShellLite' }}.apk
            ${{ vars.APP_NAME || 'ShellLite' }}.aab
          body: |
            ## ${{ vars.APP_NAME || 'ShellLite' }} ${{ needs.resolve-version.outputs.tag }}

            ${{ needs.resolve-version.outputs.changelog }}

            ### 📦 Download & Install

            #### 🤖 Android
            - **Direct APK (`${{ vars.APP_NAME || 'ShellLite' }}.apk`)**: Download and open on any Android device to install directly (enable *Install unknown apps* in system settings).
            - **App Bundle (`${{ vars.APP_NAME || 'ShellLite' }}.aab`)**: Android App Bundle for store distribution.

            #### 🍏 iOS
            - **Sideloadable IPA (`${{ vars.APP_NAME || 'ShellLite' }}.ipa`)**: Download to your device and install via:
              - **SideStore**: Open `${{ vars.APP_NAME || 'ShellLite' }}.ipa` in SideStore on your iPhone.
              - **AltStore / Sideloadly**: Select `${{ vars.APP_NAME || 'ShellLite' }}.ipa` and install to your connected device.

            #### 🌐 Web
            - Access the live web version at [https://shell.strandberg.dev/](https://shell.strandberg.dev/).
          draft: false
          prerelease: false

  deploy-play-store:
    name: Deploy to Google Play
    needs: [resolve-version, build-android]
    if: needs.resolve-version.outputs.should_release == 'true' && inputs.deploy_to_play_store != false && inputs.deploy_to_play_store != 'false'
    runs-on: ${{ vars.UBUNTU_SLIM_RUNNER || 'ubuntu-slim' }}
    env:
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
    steps:
      - name: Check Play Store Secret
        if: env.PLAY_STORE_JSON_KEY == ''
        run: |
          echo "::warning::PLAY_STORE_JSON_KEY secret is not configured in repository secrets. Skipping Google Play deployment."
          exit 0

      - name: Download Android AAB Artifact
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: ${{ vars.APP_NAME || 'ShellLite' }}-Android-AAB

      - name: Prepare Release Notes
        if: env.PLAY_STORE_JSON_KEY != ''
        env:
          CHANGELOG: ${{ needs.resolve-version.outputs.changelog }}
        run: |
          set -e
          mkdir -p whatsnew
          # Google Play enforces a maximum limit of 500 characters for localized release notes
          echo "$CHANGELOG" | head -c 500 > whatsnew/whatsnew-en-US
          echo "==> Prepared whatsnew/whatsnew-en-US:"
          cat whatsnew/whatsnew-en-US

      - name: Upload AAB to Google Play
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.bugmana.shell_lite
          releaseFiles: ${{ vars.APP_NAME || 'ShellLite' }}.aab
          tracks: ${{ inputs.play_store_track || 'alpha' }}
          status: ${{ inputs.play_store_status || 'completed' }}
          whatsNewDirectory: whatsnew

