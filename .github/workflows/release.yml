name: Build & Release iOS IPA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app
          swift --version

      - name: Run Tests
        run: swift test

      - name: Build iOS Arm64 Executable
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iPhoneOS SDK at: $SDK_PATH"
          swift build -c release \
            --triple arm64-apple-ios18.0 \
            -Xswiftc -sdk -Xswiftc "$SDK_PATH"

      - name: Package .ipa
        run: |
          # Extract version from tag or default
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0-dev"
          fi
          BUILD="${{ github.run_number }}"

          mkdir -p build_output/Payload/ShellLite.app
          
          # Copy compiled iOS binary and Info.plist into .app
          cp .build/arm64-apple-ios18.0/release/ShellLite build_output/Payload/ShellLite.app/ShellLite
          cp Sources/ShellLite/Info.plist build_output/Payload/ShellLite.app/Info.plist

          # Stamp version metadata in Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" build_output/Payload/ShellLite.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" build_output/Payload/ShellLite.app/Info.plist || true

          # Ad-hoc sign for local sideloading / SideStore / Sideloadly
          codesign --force --deep --sign - build_output/Payload/ShellLite.app

          # Package into IPA
          cd build_output
          zip -r ../ShellLite.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShellLite-iOS-IPA
          path: ShellLite.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "ShellLite ${{ github.ref_name }}"
          files: ShellLite.ipa
          body: |
            ## ShellLite ${{ github.ref_name }}

            ### 📦 Download & Install on iPhone
            Download `ShellLite.ipa` directly to your iPhone or PC:
            - **SideStore**: Open `ShellLite.ipa` in the SideStore app on your iPhone.
            - **Sideloadly / AltStore**: Select `ShellLite.ipa` and install to your connected device.
          draft: false
          prerelease: false
