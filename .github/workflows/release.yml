name: Build & Release iOS IPA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tools & Environment
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Run Tests
        run: swift test

      - name: Build for iOS
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK_PATH"
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"

          echo "==> Attempting build with xcodebuild for iOS..."
          xcodebuild build \
            -scheme "ShellLite" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true

          # Check if binary was created in DerivedData; if not, compile via swift build
          if [ ! -f "$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite" ] && [ ! -f "$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite.app/ShellLite" ]; then
            echo "==> Falling back to swift build cross-compilation for iOS..."
            swift build -c release \
              --triple arm64-apple-ios18.0 \
              -Xswiftc -sdk -Xswiftc "$SDK_PATH"
          fi

      - name: Package .ipa
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0-dev"
          fi
          BUILD="${{ github.run_number }}"

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          BINARY=""

          # Priority-based binary discovery
          if [ -f "$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite" ]; then
            BINARY="$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite"
          elif [ -f "$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite.app/ShellLite" ]; then
            BINARY="$DERIVED_DATA/Build/Products/Release-iphoneos/ShellLite.app/ShellLite"
          elif [ -f ".build/arm64-apple-ios18.0/release/ShellLite" ]; then
            BINARY=".build/arm64-apple-ios18.0/release/ShellLite"
          elif [ -f ".build/release/ShellLite" ]; then
            BINARY=".build/release/ShellLite"
          else
            # Search for built Mach-O binary excluding dSYM and macosx debug artifacts
            BINARY=$(find "$DERIVED_DATA" .build -type f -name "ShellLite" ! -path "*.dSYM*" ! -path "*/checkouts/*" ! -path "*/arm64-apple-macosx/*" ! -path "*/debug/*" 2>/dev/null | head -n 1)
          fi

          if [ -z "$BINARY" ] || [ ! -f "$BINARY" ]; then
            echo "Error: ShellLite executable binary was not found."
            echo "Listing potential build output locations:"
            find "$DERIVED_DATA" .build -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          echo "Found binary at: $BINARY"
          file "$BINARY"

          mkdir -p build_output/Payload/ShellLite.app
          cp "$BINARY" build_output/Payload/ShellLite.app/ShellLite
          chmod +x build_output/Payload/ShellLite.app/ShellLite

          if [ -f Sources/ShellLite/Info.plist ]; then
            cp Sources/ShellLite/Info.plist build_output/Payload/ShellLite.app/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" build_output/Payload/ShellLite.app/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" build_output/Payload/ShellLite.app/Info.plist || true
          fi

          echo "Applying ad-hoc code signature..."
          codesign --force --deep --sign - build_output/Payload/ShellLite.app

          cd build_output
          zip -r ../ShellLite.ipa Payload
          cd ..

          echo "ShellLite.ipa created successfully:"
          ls -lh ShellLite.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShellLite-iOS-IPA
          path: ShellLite.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "ShellLite ${{ github.ref_name }}"
          files: ShellLite.ipa
          body: |
            ## ShellLite ${{ github.ref_name }}

            ### 📦 Download & Install on iPhone
            Download `ShellLite.ipa` directly to your iPhone or PC:
            - **SideStore**: Open `ShellLite.ipa` in the SideStore app on your iPhone.
            - **Sideloadly / AltStore**: Select `ShellLite.ipa` and install to your connected device.
          draft: false
          prerelease: false
