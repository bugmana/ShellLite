name: Release → TestFlight

# Triggered by a version tag — e.g. git push origin v1.0.0
# Builds, signs, and uploads directly to TestFlight.
#
# ── Required GitHub Secrets ──────────────────────────────────────────────────
# Set these in: GitHub repo → Settings → Secrets → Actions → New secret
#
#   CERTIFICATE_P12_BASE64      Distribution certificate exported from Keychain
#                               as .p12, then: base64 -i cert.p12 | pbcopy
#
#   CERTIFICATE_PASSWORD        Password you set when exporting the .p12
#
#   PROVISIONING_PROFILE_BASE64 App Store provisioning profile (.mobileprovision)
#                               downloaded from developer.apple.com, then:
#                               base64 -i ShellLite.mobileprovision | pbcopy
#
#   ASC_API_KEY_BASE64          App Store Connect API key (.p8 file), base64'd:
#                               base64 -i AuthKey_XXXXXXXX.p8 | pbcopy
#
#   ASC_API_KEY_ID              10-character Key ID from App Store Connect
#                               (e.g. "ABCD123456")
#
#   ASC_ISSUER_ID               Issuer ID UUID from App Store Connect API Keys page
#                               (e.g. "12345678-1234-1234-1234-123456789012")
#
# ── One-time setup on a Mac ──────────────────────────────────────────────────
# 1. developer.apple.com → Certificates → create "Apple Distribution" cert
# 2. developer.apple.com → Profiles → create "App Store" provisioning profile
# 3. appstoreconnect.apple.com → Users → Keys → generate API key (Admin role)
# 4. Export cert from Keychain as .p12 (right-click → Export)
# 5. Add all 6 values above as GitHub Secrets
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-15   # Xcode 16 pre-installed

    env:
      # Derive the marketing version from the tag (strips leading 'v')
      MARKETING_VERSION: ${{ github.ref_name }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history so git describe works

      # ── 2. Select Xcode ──────────────────────────────────────────────────
      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version
          swift --version

      # ── 3. Run unit tests ────────────────────────────────────────────────
      - name: Run tests
        run: swift test

      # ── 4. Install signing certificate into a temporary keychain ─────────
      - name: Install signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD:   ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          # Decode and write the certificate
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          # Create a temporary keychain, import cert, unlock for signing
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      # ── 5. Install provisioning profile ──────────────────────────────────
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_PATH/ShellLite.mobileprovision"

      # ── 6. Install App Store Connect API key ─────────────────────────────
      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID:     ${{ secrets.ASC_API_KEY_ID }}
        run: |
          KEY_DIR="$HOME/.private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_API_KEY_BASE64" | base64 --decode \
            > "$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"

      # ── 7. Derive version and build number ───────────────────────────────
      - name: Set version numbers
        run: |
          # Strip 'v' prefix from tag for marketing version
          VERSION="${GITHUB_REF_NAME#v}"
          # Use the run number as a unique, monotonically increasing build number
          BUILD="${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD"     >> "$GITHUB_ENV"
          echo "  Marketing version : $VERSION"
          echo "  Build number      : $BUILD"

      # ── 8. Archive ───────────────────────────────────────────────────────
      - name: Archive
        run: |
          xcodebuild archive \
            -scheme ShellLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ShellLite.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            | xcpretty

      # ── 9. Export IPA ────────────────────────────────────────────────────
      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>               <string>app-store-connect</string>
            <key>destination</key>          <string>upload</string>
            <key>signingStyle</key>         <string>manual</string>
            <key>stripSwiftSymbols</key>    <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath   "$RUNNER_TEMP/ShellLite.xcarchive" \
            -exportPath    "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # ── 10. Upload to TestFlight ──────────────────────────────────────────
      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID:  ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/ShellLite.ipa" \
            --apiKey  "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo ""
          echo "✅ Build $VERSION ($BUILD) uploaded to TestFlight."
          echo "   Testers will be notified shortly."

      # ── 11. Create GitHub Release with release notes ──────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ShellLite ${{ env.VERSION }}"
          body: |
            ## ShellLite ${{ env.VERSION }}

            Build `${{ env.BUILD }}` has been uploaded to TestFlight.
            Internal testers will receive a notification shortly.

            ### Install
            Open the **TestFlight** app on your iPhone and accept the update.
          draft: false
          prerelease: false

      # ── 12. Cleanup keychain ──────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
