name: Release Multi-Platform

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (e.g. 1.2.0, only used if bump_type is custom)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      tag: ${{ steps.versioning.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version & Tag
        id: versioning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          RAW_VER="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VER"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          BUMP_TYPE="${{ inputs.bump_type }}"
          if [ "$BUMP_TYPE" = "patch" ]; then
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            VERSION="$MAJOR.$MINOR.$PATCH"
          elif [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            VERSION="$MAJOR.$MINOR.$PATCH"
          elif [ "$BUMP_TYPE" = "custom" ]; then
            VERSION="${{ inputs.custom_version }}"
          fi

          TAG="v$VERSION"
          echo "Creating annotated tag $TAG..."
          git tag -a "$TAG" -m "Release $VERSION via GitHub Actions"
          git push origin "$TAG"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (tag: $TAG)"

  build-ios:
    name: Build iOS
    needs: resolve-version
    uses: ./.github/workflows/build-ios.yml
    with:
      upload_artifact: true
      version: ${{ needs.resolve-version.outputs.version }}

  build-android:
    name: Build Android
    needs: resolve-version
    uses: ./.github/workflows/build-android.yml
    with:
      upload_artifact: true
      version: ${{ needs.resolve-version.outputs.version }}

  publish-release:
    name: Publish GitHub Release
    needs: [resolve-version, build-ios, build-android]
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: ShellLite-iOS-IPA

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: ShellLite-Android-APK

      - name: Download Android AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: ShellLite-Android-AAB

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.resolve-version.outputs.tag }}"
          name: "ShellLite ${{ needs.resolve-version.outputs.tag }}"
          files: |
            ShellLite.ipa
            ShellLite.apk
            ShellLite.aab
          body: |
            ## ShellLite ${{ needs.resolve-version.outputs.tag }}

            ### 📦 Download & Install

            #### 🤖 Android
            - **Direct APK (`ShellLite.apk`)**: Download and open on any Android device to install directly (enable *Install unknown apps* in system settings).
            - **App Bundle (`ShellLite.aab`)**: Android App Bundle for store distribution.

            #### 🍏 iOS
            - **Sideloadable IPA (`ShellLite.ipa`)**: Download to your device and install via:
              - **SideStore**: Open `ShellLite.ipa` in SideStore on your iPhone.
              - **AltStore / Sideloadly**: Select `ShellLite.ipa` and install to your connected device.

            #### 🌐 Web
            - Access the live web version at [https://shell.strandberg.dev/](https://shell.strandberg.dev/).
          draft: false
          prerelease: false
