name: Release iOS IPA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (e.g. 1.2.0, only used if bump_type is custom)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: macos-15
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      tag: ${{ steps.versioning.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version & Tag
        id: versioning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="v$VERSION"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
            RAW_VER="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VER"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            BUMP_TYPE="${{ inputs.bump_type }}"
            if [ "$BUMP_TYPE" = "patch" ]; then
              PATCH=$((PATCH + 1))
              VERSION="$MAJOR.$MINOR.$PATCH"
            elif [ "$BUMP_TYPE" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              VERSION="$MAJOR.$MINOR.$PATCH"
            elif [ "$BUMP_TYPE" = "major" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              VERSION="$MAJOR.$MINOR.$PATCH"
            elif [ "$BUMP_TYPE" = "custom" ]; then
              VERSION="${{ inputs.custom_version }}"
            fi

            TAG="v$VERSION"
            echo "Auto-creating and pushing tag $TAG..."
            git tag -a "$TAG" -m "Release $VERSION via GitHub Actions"
            git push origin "$TAG" || true
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (tag: $TAG)"

  build-and-package:
    name: Build & Package
    needs: resolve-version
    uses: ./.github/workflows/build-ios.yml
    with:
      upload_artifact: true
      version: ${{ needs.resolve-version.outputs.version }}

  publish-release:
    name: Publish GitHub Release
    needs: [resolve-version, build-and-package]
    runs-on: macos-15
    steps:
      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: ShellLite-iOS-IPA

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.resolve-version.outputs.tag }}"
          name: "ShellLite ${{ needs.resolve-version.outputs.tag }}"
          files: ShellLite.ipa
          body: |
            ## ShellLite ${{ needs.resolve-version.outputs.tag }}

            ### 📦 Download & Install on iPhone
            Download `ShellLite.ipa` directly to your iPhone or PC:
            - **SideStore**: Open `ShellLite.ipa` in the SideStore app on your iPhone.
            - **Sideloadly / AltStore**: Select `ShellLite.ipa` and install to your connected device.
          draft: false
          prerelease: false
