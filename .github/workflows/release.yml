name: Build & Release iOS IPA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tools & Schemes
        run: |
          xcodebuild -version
          swift --version
          echo "Available schemes:"
          xcodebuild -list || true

      - name: Run Tests
        run: swift test

      - name: Build for iOS
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK_PATH"

          # Determine target scheme (SPM typically creates <PackageName>-Package or <TargetName>)
          SCHEMES=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag{gsub(/^[[:space:]]+/, ""); print}')
          echo "Discovered schemes: $SCHEMES"

          TARGET_SCHEME=""
          for s in ShellLite ShellLite-Package $SCHEMES; do
            if [ -n "$s" ]; then
              TARGET_SCHEME="$s"
              break
            fi
          done
          echo "Using scheme: $TARGET_SCHEME"

          if [ -n "$TARGET_SCHEME" ]; then
            xcodebuild build \
              -scheme "$TARGET_SCHEME" \
              -destination "generic/platform=iOS" \
              -configuration Release \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" || true
          fi

          # If xcodebuild did not create binary, fallback to swift build cross-compilation
          if ! find "$RUNNER_TEMP/DerivedData" -type f -name "ShellLite" ! -path "*.dSYM*" ! -path "*.build*" 2>/dev/null | grep -q .; then
            echo "Falling back to swift build with iOS SDK..."
            swift build -c release \
              --triple arm64-apple-ios18.0 \
              -Xswiftc -sdk -Xswiftc "$SDK_PATH" \
              -Xswiftc -target -Xswiftc arm64-apple-ios18.0
          fi

      - name: Package .ipa
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0-dev"
          fi
          BUILD="${{ github.run_number }}"

          mkdir -p build_output/Payload/ShellLite.app

          # Locate compiled executable binary
          BINARY=$(find "$RUNNER_TEMP/DerivedData" .build -type f -name "ShellLite" ! -path "*.dSYM*" ! -path "*.build*" ! -path "*/checkouts/*" 2>/dev/null | head -n 1)
          if [ -z "$BINARY" ]; then
            echo "Error: ShellLite executable binary was not found."
            exit 1
          fi
          echo "Found binary at: $BINARY"

          cp "$BINARY" build_output/Payload/ShellLite.app/ShellLite
          chmod +x build_output/Payload/ShellLite.app/ShellLite
          cp Sources/ShellLite/Info.plist build_output/Payload/ShellLite.app/Info.plist

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" build_output/Payload/ShellLite.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" build_output/Payload/ShellLite.app/Info.plist || true

          codesign --force --deep --sign - build_output/Payload/ShellLite.app

          cd build_output
          zip -r ../ShellLite.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShellLite-iOS-IPA
          path: ShellLite.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "ShellLite ${{ github.ref_name }}"
          files: ShellLite.ipa
          body: |
            ## ShellLite ${{ github.ref_name }}

            ### 📦 Download & Install on iPhone
            Download `ShellLite.ipa` directly to your iPhone or PC:
            - **SideStore**: Open `ShellLite.ipa` in the SideStore app on your iPhone.
            - **Sideloadly / AltStore**: Select `ShellLite.ipa` and install to your connected device.
          draft: false
          prerelease: false
