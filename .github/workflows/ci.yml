name: CI

# Runs on every push and PR — uses official Swift 6.0 container for 100% reliability.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Swift Tests (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build --configuration debug

      - name: Run tests
        run: swift test --configuration debug
