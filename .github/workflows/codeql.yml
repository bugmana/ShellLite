name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '30 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os == 'macos-latest' && (vars.MACOS_RUNNER || 'macos-latest') || (vars.UBUNTU_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: 120
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-latest
          - language: c-cpp
            build-mode: none
            os: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            os: ubuntu-latest
          - language: java-kotlin
            build-mode: manual
            os: ubuntu-latest
          - language: swift
            build-mode: manual
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: ${{ vars.JAVA_DISTRIBUTION || 'temurin' }}
          java-version: ${{ vars.JAVA_VERSION || '17' }}
          cache: 'gradle'

      - name: Setup Flutter
        if: matrix.language == 'java-kotlin' || matrix.language == 'swift'
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ vars.FLUTTER_CHANNEL || 'stable' }}
          cache: true

      - name: Install Dependencies
        if: matrix.language == 'java-kotlin' || matrix.language == 'swift'
        run: flutter pub get

      - name: Configure Gradle for CodeQL Tracing
        if: matrix.language == 'java-kotlin'
        run: echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Pre-build iOS with Flutter
        if: matrix.language == 'swift'
        run: flutter build ios --no-codesign --simulator

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Android Code (manual)
        if: matrix.language == 'java-kotlin'
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Build iOS Code (manual)
        if: matrix.language == 'swift'
        run: xcodebuild clean build -workspace ios/Runner.xcworkspace -scheme Runner -destination 'generic/platform=iOS Simulator' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO SWIFT_USE_INTEGRATED_DRIVER=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
