name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    name: Enable Dependabot Auto-Merge
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Fetch Dependabot Metadata
        if: github.event_name == 'pull_request'
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve & Enable Auto-Merge for PR
        if: github.event_name == 'pull_request' && steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL" || true
          gh pr merge --auto --squash "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Process Open Dependabot PRs (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Checking for open Dependabot PRs..."
          PRS=$(gh pr list --app dependabot --json number --jq '.[].number')
          if [ -z "$PRS" ]; then
            echo "No open Dependabot PRs found."
          else
            for PR in $PRS; do
              echo "Processing Dependabot PR #$PR..."
              gh pr review --approve "$PR" || true
              gh pr merge --auto --squash "$PR" || true
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
