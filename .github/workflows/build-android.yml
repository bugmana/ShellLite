name: Build Flutter Android

on:
  workflow_call:
    inputs:
      upload_artifact:
        description: 'Whether to package and upload the APK and AAB artifacts'
        required: false
        default: false
        type: boolean
      version:
        description: 'Version string for the Android build'
        required: false
        default: '1.0.1'
        type: string

jobs:
  build-android:
    name: Flutter Android Build
    runs-on: ${{ vars.UBUNTU_RUNNER || 'ubuntu-latest' }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ vars.JAVA_DISTRIBUTION || 'temurin' }}
          java-version: ${{ vars.JAVA_VERSION || '17' }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ vars.FLUTTER_CHANNEL || 'stable' }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Signing Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -e
          echo "Configuring persistent release keystore from secrets..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cp android/upload-keystore.jks android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
storePassword=$ANDROID_KEYSTORE_PASSWORD
keyPassword=$ANDROID_KEY_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
storeFile=upload-keystore.jks
EOF
          cp android/key.properties android/app/key.properties
          echo "Release keystore configured successfully."

      - name: Build Android Release APK
        run: |
          set -e
          echo "==> Building Flutter Android Release APK..."
          flutter build apk --release --android-skip-build-dependency-validation --build-name="${{ inputs.version }}" --build-number="${{ github.run_number }}"

      - name: Build Android App Bundle (AAB)
        run: |
          set -e
          echo "==> Building Flutter Android Release AAB..."
          flutter build appbundle --release --android-skip-build-dependency-validation --build-name="${{ inputs.version }}" --build-number="${{ github.run_number }}"

      - name: Prepare Artifacts
        if: inputs.upload_artifact
        run: |
          set -e
          APP="${{ vars.APP_NAME || 'ShellLite' }}"
          cp build/app/outputs/flutter-apk/app-release.apk "${APP}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "${APP}.aab"
          echo "Android artifacts prepared successfully:"
          ls -lh "${APP}.apk" "${APP}.aab"

      - name: Upload Android APK Artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.APP_NAME || 'ShellLite' }}-Android-APK
          path: ${{ vars.APP_NAME || 'ShellLite' }}.apk
          retention-days: ${{ fromJson(vars.ARTIFACT_RETENTION_DAYS || '30') }}

      - name: Upload Android AAB Artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.APP_NAME || 'ShellLite' }}-Android-AAB
          path: ${{ vars.APP_NAME || 'ShellLite' }}.aab
          retention-days: ${{ fromJson(vars.ARTIFACT_RETENTION_DAYS || '30') }}
