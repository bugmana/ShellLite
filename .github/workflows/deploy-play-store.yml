name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play release track'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - internal
          - beta
          - production
      status:
        description: 'Google Play release status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
      release_tag:
        description: 'Release tag to deploy (e.g. v1.8.0, leave empty for latest release)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Google Play
    runs-on: ${{ vars.UBUNTU_SLIM_RUNNER || 'ubuntu-slim' }}
    env:
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Play Store Secret
        if: env.PLAY_STORE_JSON_KEY == ''
        run: |
          echo "::error::PLAY_STORE_JSON_KEY secret is not configured in repository secrets."
          exit 1

      - name: Determine Target Release Tag
        id: target-release
        run: |
          set -e
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName)
            echo "No tag specified, resolved latest release tag: $TAG"
          else
            echo "Using specified release tag: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Release AAB and Release Notes
        env:
          TAG: ${{ steps.target-release.outputs.tag }}
          APP: ${{ vars.APP_NAME || 'ShellLite' }}
        run: |
          set -e
          echo "Downloading ${APP}.aab from release ${TAG}..."
          gh release download "$TAG" -p "${APP}.aab"
          
          mkdir -p whatsnew
          # Extract release notes from GitHub Release body, max 500 chars for Play Store
          gh release view "$TAG" --json body -q .body | head -c 500 > whatsnew/whatsnew-en-US
          echo "==> Prepared whatsnew/whatsnew-en-US from release body:"
          cat whatsnew/whatsnew-en-US

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.bugmana.shell_lite
          releaseFiles: ${{ vars.APP_NAME || 'ShellLite' }}.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: whatsnew
